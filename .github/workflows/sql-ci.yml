name: SQL Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SQL Scripts on Test Database
        run: |
          echo "--- Exécution du script de setup (tables, relations) ---"
          psql "postgresql://postgres:password123@localhost:5432/postgres" -f setup.sql

          echo "--- Exécution du script d'administration (rôles, index, contraintes) ---"
          psql "postgresql://postgres:password123@localhost:5432/postgres" -f administration.sql