name: SQL Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sql:
    runs-on: ubuntu-latest
    
    # Stratégie Matrix : Teste simultanément sur PostgreSQL 14, 15 et 16
    strategy:
      matrix:
        postgres-version: [ '14', '15', '16' ]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SQL Scripts & Test Backup/Restore
        run: |
          echo "--- 1. Exécution du setup ---"
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:password123@localhost:5432/postgres" -f setup.sql

          echo "--- 2. Exécution de l'administration ---"
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:password123@localhost:5432/postgres" -f administration.sql

          echo "--- 3. Test Q29 : Dump compressé ---"
          PGPASSWORD=password123 pg_dump -h localhost -U postgres -F c -b -v -f backup_ecommerce.dump postgres

          echo "--- 4. Test Q30 : Dump SQL lisible ---"
          PGPASSWORD=password123 pg_dump -h localhost -U postgres -F p -v -f backup_ecommerce.sql postgres

          echo "--- 5. Test Q31 : Création de la base restaurée et restauration ---"
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:password123@localhost:5432/postgres" -c "DROP DATABASE IF EXISTS ecommerce_restauree; CREATE DATABASE ecommerce_restauree;"
          PGPASSWORD=password123 pg_restore -h localhost -U postgres -d ecommerce_restauree -v backup_ecommerce.dump