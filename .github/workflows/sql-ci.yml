name: SQL Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sql:
    runs-on: ubuntu-latest
    
    # Stratégie Matrix : Teste simultanément sur PostgreSQL 14, 15 et 16
    strategy:
      matrix:
        postgres-version: [ '14', '15', '16' ]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SQL Scripts with Strict Error Handling
        run: |
          echo "--- Exécution du setup sur PostgreSQL v${{ matrix.postgres-version }} ---"
          # v 1 = arrêter immédiatement le script à la première erreur SQL
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:password123@localhost:5432/postgres" -f setup.sql

          echo "--- Exécution de l'administration ---"
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:password123@localhost:5432/postgres" -f administration.sql